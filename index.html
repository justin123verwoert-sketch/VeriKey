<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriKey - Modern Two-Factor Authenticator</title>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .container { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 480px; width: 100%; padding: 32px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .logo-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-weight: bold; font-size: 28px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    
    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); margin-top: 12px; }
    .btn-secondary:hover { background-color: rgba(255,255,255,0.05); color: var(--text); }

    .user-profile { text-align: center; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--primary); margin-bottom: 12px; }
    .otp-card { background-color: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 16px; margin: 20px 0; }
    .otp-code { font-family: monospace; font-size: 32px; letter-spacing: 4px; color: var(--primary); margin-top: 8px; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div id="view-logged-out">
      <div class="logo-icon">🔑</div>
      <h1>VeriKey</h1>
      <p class="subtitle">Secure multi-factor authentication for all your digital accounts.</p>
      <button id="btn-login" class="btn">Log In to VeriKey</button>
    </div>

    <div id="view-logged-in" class="hidden">
      <div class="user-profile">
        <img id="user-avatar" class="avatar" src="" alt="Profile Picture">
        <h2 id="user-name">Welcome</h2>
        <p id="user-email" class="subtitle"></p>
      </div>

      <div class="otp-card">
        <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Your VeriKey Code</div>
        <div class="otp-code" id="otp-display">849 201</div>
      </div>

      <button id="btn-logout" class="btn btn-secondary">Log Out</button>
    </div>
  </div>

  <script>
    let auth0Client = null;

    const auth0Config = {
      domain: "dev-lql5ujqw06xmyjoo.us.auth0.com",
      clientId: "YPPXfEgtGa7dKoFWMmDmGtRH6rwIZO7d",
      authorizationParams: {
        redirect_uri: window.location.origin + '/VeriKey/'
      }
    };

    window.onload = async () => {
      // Initialize Auth0 SDK
      auth0Client = await auth0.createAuth0Client(auth0Config);

      // Handle redirect after login
      if (window.location.search.includes("code=") && window.location.search.includes("state=")) {
        await auth0Client.handleRedirectCallback();
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      updateUI();
    };

    async function updateUI() {
      const isAuthenticated = await auth0Client.isAuthenticated();

      if (isAuthenticated) {
        const user = await auth0Client.getUser();
        
        document.getElementById("user-avatar").src = user.picture;
        document.getElementById("user-name").innerText = user.name || user.nickname;
        document.getElementById("user-email").innerText = user.email;

        document.getElementById("view-logged-out").classList.add("hidden");
        document.getElementById("view-logged-in").classList.remove("hidden");
      } else {
        document.getElementById("view-logged-out").classList.remove("hidden");
        document.getElementById("view-logged-in").classList.add("hidden");
      }
    }

    document.getElementById("btn-login").addEventListener("click", () => {
      auth0Client.loginWithRedirect();
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      auth0Client.logout({
        logoutParams: {
          returnTo: window.location.origin + '/VeriKey/'
        }
      });
    });
  </script>
</body>
</html>
